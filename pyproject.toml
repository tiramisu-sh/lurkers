[project]
name = "lurkers"
version = "0.1.0"
description = "Convenient API + CLI to fetch web content for agents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Vladimir Sotnikov", email = "vladimir.s@alphakek.ai" },
]
keywords = ["crawler", "scraper", "fetcher", "agents", "llm", "ai", "data", "rss", "youtube"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "trafilatura>=1.12",
    "youtube-transcript-api>=0.6",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/tiramisu-sh/lurkers"
Repository = "https://github.com/tiramisu-sh/lurkers"
Issues = "https://github.com/tiramisu-sh/lurkers/issues"

[project.scripts]
lurkers = "lurkers.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lurkers"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lurkers"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
